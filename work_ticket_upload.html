<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>瑞渊办公｜工作票上传</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f7f4;color:#244536;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{background:#174b39;color:white;padding:17px 5%}header a{color:white}header .bar{max-width:1150px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}main{max-width:1150px;margin:25px auto;padding:0 16px}.panel{background:white;border:1px solid #dce8df;border-radius:12px;padding:22px;margin:18px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}h1{margin:0;font-size:25px}h2{font-size:19px;margin:0 0 15px}.muted{color:#74877a}button{padding:9px 14px;background:white;border:1px solid #cbdcd0;border-radius:7px;color:#174b39;cursor:pointer}button.primary{background:#174b39;color:white}button:disabled{opacity:.5}input,textarea{width:100%;border:1px solid #cbdcd0;border-radius:7px;padding:10px;font:inherit}label{display:block;font-weight:700;margin:10px 0 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5eee7;vertical-align:top}th{background:#edf5ee}.thumbs{display:flex;gap:10px;flex-wrap:wrap}.thumb img{width:110px;height:95px;object-fit:contain}.error{color:#b4232c}.success{color:#18714a}[hidden]{display:none!important}#gate{min-height:65vh;display:grid;place-items:center}dialog{border:0;border-radius:12px;max-width:95vw;max-height:95vh}dialog::backdrop{background:#071b16dd}#bigImage{display:block;max-width:88vw;max-height:76vh;object-fit:contain;cursor:zoom-in}#bigImage.zoom{max-width:none;max-height:none;cursor:zoom-out}.viewerScroll{max-width:90vw;max-height:80vh;overflow:auto}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<section id="gate"><div class="panel"><h2>瑞渊工作票</h2><p id="gateMsg">正在验证登录身份……</p><a href="/login.html">返回登录</a> <button id="retry">重新验证</button></div></section>
<div id="app" hidden><header><div class="bar"><strong>瑞渊办公 · 工作票上传</strong><div class="row"><span id="username"></span><a id="back" href="/wholemanagement.html">返回工作台 →</a><button id="logout">退出登录</button></div></div></header><main><div class="row between"><div><h1>工作票上传与档案查询</h1><p class="muted">登记工作时间、地点、内容、工作人员及图片，方便日后查阅。</p></div><button id="new" class="primary">＋ 新增工作票</button></div><p id="notice" role="status"></p>
<section class="panel" id="listPanel"><div class="row between"><h2>工作票档案</h2><div class="row"><input id="search" placeholder="搜索时间、地点、内容、工作人员" style="max-width:350px"><button id="refresh">刷新</button></div></div><div class="scroll"><table><thead><tr><th>工作时间</th><th>地点</th><th>工作内容</th><th>工作人员</th><th>登记人</th><th>图片数</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="panel" id="formPanel" hidden><div class="row between"><h2 id="formTitle">新增工作票</h2><button id="return">返回清单</button></div><form id="form"><div class="grid"><div><label>工作时间 *</label><input id="workAt" type="datetime-local" required></div><div><label>工作地点 *</label><input id="locationField" maxlength="300" required></div><div class="full"><label>工作内容 *</label><textarea id="contentField" rows="4" maxlength="5000" required></textarea></div><div class="full"><label>工作人员 *</label><textarea id="workersField" rows="2" maxlength="1000" required placeholder="多人可用顿号分隔"></textarea></div><div class="full"><label>工作票图片（最多6张，自动压缩WebP，每张不超过1MB）</label><input id="filesField" type="file" accept="image/*" multiple><p class="muted">可选择手机相册或拍照。先保存工作票，再上传图片。</p><div id="images" class="thumbs"></div></div></div><div class="row"><button class="primary" id="save" type="submit">保存工作票及图片</button><button type="button" id="cancel">取消</button></div></form></section></main></div>
<dialog id="viewer"><div class="row between"><strong>工作票图片</strong><button id="closeViewer">关闭 ×</button></div><div class="viewerScroll"><img id="bigImage" alt="工作票大图"></div><p class="muted">点击图片放大/恢复，Esc关闭</p></dialog>
<script>
'use strict';const API='https://api.ruiyuantechnology.com/api/ruiyuan',$=id=>document.getElementById(id);let csrf='',actor=null,items=[],editing=null,busy=false,viewerUrl='',thumbUrls=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(t,bad=false){$('notice').textContent=t||'';$('notice').className=bad?'error':'success'}
async function api(path,body){const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);try{const opt={credentials:'include',cache:'no-store',headers:{Accept:'application/json'},signal:c.signal};if(body!==undefined){opt.method='POST';opt.headers['Content-Type']='application/json';opt.headers['X-Ruiyuan-CSRF']=csrf;opt.body=JSON.stringify(body)}const r=await fetch(API+path,opt),d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw Error(d.error||'HTTP '+r.status);return d}finally{clearTimeout(t)}}
function dateText(v){return v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'—'}
function dateInput(v){const d=v?new Date(v):new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function render(){const q=$('search').value.trim().toLowerCase(),data=items.filter(x=>[dateText(x.work_at),x.location,x.content,x.workers,x.creator_name].some(y=>String(y||'').toLowerCase().includes(q)));$('rows').innerHTML=data.map(x=>`<tr><td>${esc(dateText(x.work_at))}</td><td>${esc(x.location)}</td><td>${esc(x.content)}</td><td>${esc(x.workers)}</td><td>${esc(x.creator_name)}</td><td>${Number(x.image_count||0)}张</td><td><button data-open="${esc(x.id)}">查看${actor.role==='finance'?'':'/编辑'}</button></td></tr>`).join('')||'<tr><td colspan="7">暂无记录</td></tr>'}
async function load(){const d=await api('/work-tickets');items=d.items||[];render()}
function clearThumbs(){thumbUrls.forEach(u=>URL.revokeObjectURL(u));thumbUrls=[];$('images').replaceChildren()}
async function getBlob(id,imageId){const r=await fetch(API+'/work-tickets/image?id='+encodeURIComponent(id)+'&image_id='+encodeURIComponent(imageId),{credentials:'include',cache:'no-store'});if(!r.ok)throw Error('读取图片失败 HTTP '+r.status);const b=await r.blob();if(!b.type.startsWith('image/'))throw Error('返回的不是图片');return b}
async function viewImage(id,imageId){$('viewer').showModal();$('bigImage').removeAttribute('src');$('bigImage').classList.remove('zoom');try{const b=await getBlob(id,imageId);viewerUrl=URL.createObjectURL(b);$('bigImage').src=viewerUrl}catch(e){$('viewer').close();notice(e.message,true)}}
async function showImages(id){clearThumbs();const d=await api('/work-tickets/images',{id});for(const x of d.images||[]){const b=document.createElement('button');b.type='button';b.className='thumb';b.textContent='加载中…';$('images').appendChild(b);try{const blob=await getBlob(id,x.id),u=URL.createObjectURL(blob);thumbUrls.push(u);b.textContent='';const img=document.createElement('img');img.src=u;img.alt='工作票图片';b.appendChild(img);b.onclick=()=>viewImage(id,x.id)}catch{b.textContent='图片读取失败';b.disabled=true}}}
async function openForm(x){editing=x?.id||null;$('form').reset();$('formTitle').textContent=x?'查看/编辑工作票':'新增工作票';$('workAt').value=dateInput(x?.work_at);$('locationField').value=x?.location||'';$('contentField').value=x?.content||'';$('workersField').value=x?.workers||'';$('listPanel').hidden=true;$('formPanel').hidden=false;const readonly=actor.role==='finance';for(const id of ['workAt','locationField','contentField','workersField','filesField'])$(id).disabled=readonly;$('save').hidden=readonly;clearThumbs();if(x)try{await showImages(x.id)}catch(e){notice(e.message,true)}}
function showList(){$('formPanel').hidden=true;$('listPanel').hidden=false;editing=null;clearThumbs()}
async function compress(file){if(file.size>20*1024*1024)throw Error('原图不能超过20MB');const bmp=await createImageBitmap(file),s=Math.min(1,1600/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(bmp,0,0,c.width,c.height);bmp.close();for(let q=.82;q>=.2;q-=.12){const b=await new Promise(ok=>c.toBlob(ok,'image/webp',q));if(b&&b.size<=1048576)return b}throw Error('图片压缩后仍超过1MB')}
async function upload(id,file){const blob=await compress(file),r=await fetch(API+'/work-tickets/image?id='+encodeURIComponent(id),{method:'POST',credentials:'include',headers:{'Content-Type':'image/webp','X-Ruiyuan-CSRF':csrf},body:blob}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'上传失败 HTTP '+r.status)}
$('rows').onclick=e=>{const b=e.target.closest('[data-open]');if(!b)return;const x=items.find(y=>y.id===b.dataset.open);if(x)openForm(x)};
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('save').disabled=true;try{const files=[...$('filesField').files],count=editing?(await api('/work-tickets/images',{id:editing})).images.length:0;if(count+files.length>6)throw Error('每条工作票最多6张图片');const d=await api('/work-tickets/save',{id:editing,work_at:new Date($('workAt').value).toISOString(),location:$('locationField').value.trim(),content:$('contentField').value.trim(),workers:$('workersField').value.trim()});const failures=[];for(let i=0;i<files.length;i++){notice(`已保存记录，上传图片 ${i+1}/${files.length}…`);try{await upload(d.id,files[i])}catch(err){failures.push(`第${i+1}张：${err.message}`)}}await load();if(failures.length){editing=d.id;notice('记录已保存，部分图片失败：'+failures.join('；'),true);await showImages(d.id)}else{showList();notice('工作票及图片保存成功')}}catch(e){notice(e.message,true)}finally{busy=false;$('save').disabled=false}};
$('new').onclick=()=>openForm(null);$('return').onclick=showList;$('cancel').onclick=showList;$('refresh').onclick=()=>load().catch(e=>notice(e.message,true));$('search').oninput=render;
$('closeViewer').onclick=()=>$('viewer').close();$('bigImage').onclick=()=>$('bigImage').classList.toggle('zoom');$('viewer').onclose=()=>{if(viewerUrl)URL.revokeObjectURL(viewerUrl);viewerUrl='';$('bigImage').removeAttribute('src')};
$('logout').onclick=async()=>{try{await api('/logout',{});location.replace('/login.html')}catch(e){notice(e.message,true)}};
async function verify(){try{const d=await api('/session');if(!d.user){$('gateMsg').textContent='请先登录';return}if(d.user.must_change_password){$('gateMsg').textContent='请先修改初始密码';return}if(!['admin','employee','sales','finance'].includes(d.user.role)){$('gateMsg').textContent='无工作票访问权限';return}actor=d.user;csrf=d.csrf_token||'';$('username').textContent=actor.full_name||actor.username;$('back').href=actor.role==='admin'?'/wholemanagement.html':actor.role==='sales'?'/sales.html':actor.role==='finance'?'/finance.html':'/engineer.html';$('new').hidden=actor.role==='finance';await load();$('gate').hidden=true;$('app').hidden=false}catch(e){$('gateMsg').textContent='验证失败：'+e.message}}
$('retry').onclick=verify;window.addEventListener('pageshow',verify);
</script></body></html>
