<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>瑞渊办公｜工作票上传</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f7f4;color:#244536;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{background:#174b39;color:white;padding:17px 5%}header a{color:white}header .bar{max-width:1150px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}main{max-width:1150px;margin:25px auto;padding:0 16px}.panel{background:white;border:1px solid #dce8df;border-radius:12px;padding:22px;margin:18px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}h1{margin:0;font-size:25px}h2{font-size:19px;margin:0 0 15px}.muted{color:#74877a}button{padding:9px 14px;background:white;border:1px solid #cbdcd0;border-radius:7px;color:#174b39;cursor:pointer}button.primary{background:#174b39;color:white}button:disabled{opacity:.5}input,textarea{width:100%;border:1px solid #cbdcd0;border-radius:7px;padding:10px;font:inherit}label{display:block;font-weight:700;margin:10px 0 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5eee7;vertical-align:top}th{background:#edf5ee}.thumbs{display:flex;gap:10px;flex-wrap:wrap}.thumb img{width:110px;height:95px;object-fit:contain}.error{color:#b4232c}.success{color:#18714a}[hidden]{display:none!important}#gate{min-height:65vh;display:grid;place-items:center}dialog{border:0;border-radius:12px;max-width:95vw;max-height:95vh}dialog::backdrop{background:#071b16dd}#bigImage{display:block;max-width:88vw;max-height:76vh;object-fit:contain;cursor:zoom-in}#bigImage.zoom{max-width:none;max-height:none;cursor:zoom-out}.viewerScroll{max-width:90vw;max-height:80vh;overflow:auto}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<section id="gate"><div class="panel"><h2>瑞渊工作票</h2><p id="gateMsg">正在验证登录身份……</p><a href="/login.html">返回登录</a> <button id="retry">重新验证</button></div></section>
<div id="app" hidden><header><div class="bar"><strong>瑞渊办公 · 工作票上传</strong><div class="row"><span id="username"></span><a id="back" href="/wholemanagement.html">返回工作台 →</a><button id="logout">退出登录</button></div></div></header><main><div class="row between"><div><h1>工作票上传与档案查询</h1><p class="muted">所有系统成员均可登记、查看、选择和上传工作票；只有管理员可以删除。</p></div><button id="new" class="primary" hidden>＋ 新增工作票</button></div><p id="notice" role="status"></p>
<section class="panel" id="listPanel"><div class="row between"><h2>工作票档案（仅系统成员查看与选择）</h2><div class="row"><input id="search" placeholder="搜索时间、地点、内容、工作人员" style="max-width:350px"><button id="refresh">刷新</button></div></div><p id="selectedTicket" class="muted">尚未选择工作票</p><div class="scroll"><table><thead><tr><th>工作票名称</th><th>工作时间</th><th>地点</th><th>工作内容</th><th>工作人员</th><th>登记人</th><th>图片数</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="panel" id="formPanel" hidden><div class="row between"><h2 id="formTitle">新增工作票</h2><button id="return">返回清单</button></div><form id="form"><div class="grid"><div><label>工作时间 *</label><input id="workAt" type="datetime-local" required></div><div><label>工作地点（变电站名称）*</label><input id="locationField" maxlength="80" required placeholder="例如：南通东郊变电站，系统自动生成工作票名称"></div><div class="full"><label>工作票名称（系统自动生成，不可修改）</label><input id="titlePreview" readonly></div><div class="full"><label>工作内容 *</label><textarea id="contentField" rows="4" maxlength="5000" required></textarea></div><div class="full"><label>工作人员 *</label><textarea id="workersField" rows="2" maxlength="1000" required placeholder="多人可用顿号分隔"></textarea></div><div class="full"><label>工作票图片（4类必填 + 最多4张补充照片，合计最多8张；每张压缩WebP ≤1MB）</label><div class="grid" id="requiredPhotos">
<div><label>① 工作票图片 *</label><input data-category="ticket" type="file" accept="image/*"></div>
<div><label>② 现场照片 *</label><input data-category="site" type="file" accept="image/*"></div>
<div><label>③ 施工前照片 *</label><input data-category="before" type="file" accept="image/*"></div>
<div><label>④ 施工后照片 *</label><input data-category="after" type="file" accept="image/*"></div>
</div><label>其他补充照片（选填，最多4张）</label><input id="filesField" type="file" accept="image/*" multiple><p class="muted">已有的分类照片保留，无需重复上传。历史未分类照片显示为“历史照片”，需要补齐四类后才算完成。</p><div id="images" class="thumbs"></div></div></div><div class="row"><button class="primary" id="save" type="submit">保存工作票及图片</button><button type="button" id="cancel">取消</button></div></form></section></main></div>
<dialog id="viewer"><div class="row between"><strong>工作票图片</strong><button id="closeViewer">关闭 ×</button></div><div class="viewerScroll"><img id="bigImage" alt="工作票大图"></div><p class="muted">点击图片放大/恢复，Esc关闭</p></dialog>
<script>
'use strict';const API='https://api.ruiyuantechnology.com/api/ruiyuan',$=id=>document.getElementById(id);let csrf='',actor=null,items=[],editing=null,busy=false,viewerUrl='',thumbUrls=[],selectedId=null;
const PHOTO_NAMES={ticket:'工作票',site:'现场照片',before:'开工前照片',after:'竣工后照片',extra:'补充照片'};let existingImages=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(t,bad=false){$('notice').textContent=t||'';$('notice').className=bad?'error':'success'}
async function api(path,body){const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);try{const opt={credentials:'include',cache:'no-store',headers:{Accept:'application/json'},signal:c.signal};if(body!==undefined){opt.method='POST';opt.headers['Content-Type']='application/json';opt.headers['X-Ruiyuan-CSRF']=csrf;opt.body=JSON.stringify(body)}const r=await fetch(API+path,opt),d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw Error(d.error||'HTTP '+r.status);return d}finally{clearTimeout(t)}}
function dateText(v){return v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'—'}
function dateInput(v){const d=v?new Date(v):new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function buildTitle(){const date=$('workAt').value.slice(0,10).replace(/-/g,'');const raw=$('locationField').value.trim();if(!date||!raw)return '';return date+'-'+raw+(raw.endsWith('变电站')?'':'变电站')}
function canEdit(x){return !!actor && ['admin','employee','sales','finance','partner'].includes(actor.role)}
function render(){const q=$('search').value.trim().toLowerCase(),data=items.filter(x=>[dateText(x.work_at),x.location,x.content,x.workers,x.creator_name].some(y=>String(y||'').toLowerCase().includes(q)));$('rows').innerHTML=data.map(x=>`<tr style="${selectedId===x.id?'background:#e5f2e9':''}"><td>${esc(x.title||'—')}</td><td>${esc(dateText(x.work_at))}</td><td>${esc(x.location)}</td><td>${esc(x.content)}</td><td>${esc(x.workers)}</td><td>${esc(x.creator_name)}</td><td>${Number(x.image_count||0)}张</td><td><button data-select="${esc(x.id)}">${selectedId===x.id?'已选择':'选择'}</button> <button data-open="${esc(x.id)}">查看</button> ${canEdit(x)?`<button data-edit="${esc(x.id)}">编辑</button>`:''} ${actor?.role==='admin'?`<button data-delete="${esc(x.id)}" style="color:#b4232c">删除</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8">暂无记录</td></tr>'}
async function load(){const d=await api('/work-tickets');items=d.items||[];render()}
function clearThumbs(){thumbUrls.forEach(u=>URL.revokeObjectURL(u));thumbUrls=[];$('images').replaceChildren()}
async function getBlob(id,imageId){const r=await fetch(API+'/work-tickets/image?id='+encodeURIComponent(id)+'&image_id='+encodeURIComponent(imageId),{credentials:'include',cache:'no-store'});if(!r.ok)throw Error('读取图片失败 HTTP '+r.status);const b=await r.blob();if(!b.type.startsWith('image/'))throw Error('返回的不是图片');return b}
async function viewImage(id,imageId){$('viewer').showModal();$('bigImage').removeAttribute('src');$('bigImage').classList.remove('zoom');try{const b=await getBlob(id,imageId);viewerUrl=URL.createObjectURL(b);$('bigImage').src=viewerUrl}catch(e){$('viewer').close();notice(e.message,true)}}
async function showImages(id){clearThumbs();const d=await api('/work-tickets/images?id='+encodeURIComponent(id));existingImages=d.images||[];for(const x of d.images||[]){const b=document.createElement('button');b.type='button';b.className='thumb';b.textContent='加载中…';$('images').appendChild(b);try{const blob=await getBlob(id,x.id),u=URL.createObjectURL(blob);thumbUrls.push(u);b.textContent='';const label=document.createElement('div');label.textContent=PHOTO_NAMES[x.category]||'历史照片（未分类）';b.append(label);const img=document.createElement('img');img.src=u;img.alt='工作票图片';b.appendChild(img);b.onclick=()=>viewImage(id,x.id)}catch{b.textContent='图片读取失败';b.disabled=true}}}
async function openForm(x){editing=x?.id||null;$('form').reset();$('formTitle').textContent=x?'查看/编辑工作票':'新增工作票';$('workAt').value=dateInput(x?.work_at);$('locationField').value=x?.location||'';$('titlePreview').value=x?.title||buildTitle();$('contentField').value=x?.content||'';$('workersField').value=x?.workers||'';$('listPanel').hidden=true;$('formPanel').hidden=false;const readonly=!actor || (x? !canEdit(x): !['admin','employee','sales','finance','partner'].includes(actor.role));for(const id of ['workAt','locationField','contentField','workersField','filesField'])$(id).disabled=readonly;document.querySelectorAll('[data-category]').forEach(input=>input.disabled=readonly);$('save').hidden=readonly;clearThumbs();existingImages=[];if(x)try{await showImages(x.id)}catch(e){notice(e.message,true)}}
function showList(){$('formPanel').hidden=true;$('listPanel').hidden=false;editing=null;clearThumbs()}
async function compress(file){if(file.size>20*1024*1024)throw Error('原图不能超过20MB');const bmp=await createImageBitmap(file),s=Math.min(1,1600/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(bmp,0,0,c.width,c.height);bmp.close();for(let q=.82;q>=.2;q-=.12){const b=await new Promise(ok=>c.toBlob(ok,'image/webp',q));if(b&&b.size<=1048576)return b}throw Error('图片压缩后仍超过1MB')}
async function upload(id,file,category){const blob=await compress(file),r=await fetch(API+'/work-tickets/image?id='+encodeURIComponent(id)+'&category='+encodeURIComponent(category),{method:'POST',credentials:'include',headers:{'Content-Type':'image/webp','X-Ruiyuan-CSRF':csrf},body:blob}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'上传失败 HTTP '+r.status)}
$('rows').onclick=async e=>{
 const b=e.target.closest('button[data-select],button[data-open],button[data-edit],button[data-delete]');if(!b)return;
 const id=b.dataset.select||b.dataset.open||b.dataset.edit||b.dataset.delete;
 const x=items.find(y=>y.id===id);if(!x)return;
 if(b.dataset.select){selectedId=id;$('selectedTicket').textContent='已选择：'+(x.title||dateText(x.work_at))+' · '+x.location+' · '+x.workers;render();return;}
 if(b.dataset.delete){if(actor?.role!=='admin')return notice('仅管理员可以删除',true);if(!confirm('确定永久删除这张工作票及其所有图片吗？此操作不可撤销。'))return;
  try{const d=await api('/work-tickets/delete',{id});if(selectedId===id){selectedId=null;$('selectedTicket').textContent='尚未选择工作票';}await load();notice(d.warning||'工作票已删除',!!d.warning)}catch(err){notice(err.message,true)}return;}
 if(b.dataset.edit&&!canEdit(x))return notice('无权编辑这张工作票',true);
 await openForm(x);
};
$('form').onsubmit=async e=>{
 e.preventDefault();if(!actor||!['admin','employee','sales','finance','partner'].includes(actor.role))return notice('请登录有登记权限的账号',true);
 if(busy)return;busy=true;$('save').disabled=true;
 try{
  const selectedFiles=[...document.querySelectorAll('[data-category]')].filter(el=>el.files[0]).map(el=>({category:el.dataset.category,file:el.files[0]}));
  const extras=[...$('filesField').files].map(file=>({category:'extra',file}));
  const prior=editing?(await api('/work-tickets/images?id='+encodeURIComponent(editing))).images||[]:[];
  const all=[...selectedFiles,...extras];
  const required=['ticket','site','before','after'];
  for(const category of required){
   if(!prior.some(x=>x.category===category)&&!selectedFiles.some(x=>x.category===category))throw Error('请上传必填图片：'+PHOTO_NAMES[category]);
   if(prior.some(x=>x.category===category)&&selectedFiles.some(x=>x.category===category))throw Error(PHOTO_NAMES[category]+'已上传；暂不支持直接覆盖旧图片');
  }
  if(prior.length+all.length>8)throw Error('每条工作票最多8张图片');
  if(prior.filter(x=>x.category==='extra').length+extras.length>4)throw Error('补充照片最多4张');
  const d=await api('/work-tickets/save',{id:editing,work_at:new Date($('workAt').value).toISOString(),station:$('locationField').value.trim(),location:$('locationField').value.trim(),content:$('contentField').value.trim(),workers:$('workersField').value.trim()});
  editing=d.id;const failures=[];
  for(let i=0;i<all.length;i++){
   notice(`正在上传 ${PHOTO_NAMES[all[i].category]}（${i+1}/${all.length}）…`);
   try{await upload(d.id,all[i].file,all[i].category)}catch(err){failures.push(PHOTO_NAMES[all[i].category]+'：'+err.message)}
  }
  if(failures.length)throw Error('图片上传未全部成功：'+failures.join('；')+'。已成功的照片已保存，请补传失败类别。');
  await api('/work-tickets/finalize',{id:d.id});
  await load();showList();notice('工作票及4类必填图片保存成功');
 }catch(err){notice(err.message,true);if(editing)try{await showImages(editing)}catch{}}
 finally{busy=false;$('save').disabled=false}
};
$('new').onclick=()=>{if(actor&&['admin','employee','sales','finance','partner'].includes(actor.role))openForm(null)};$('return').onclick=showList;$('cancel').onclick=showList;$('refresh').onclick=()=>load().catch(e=>notice(e.message,true));$('search').oninput=render;
$('closeViewer').onclick=()=>$('viewer').close();$('bigImage').onclick=()=>$('bigImage').classList.toggle('zoom');$('viewer').onclose=()=>{if(viewerUrl)URL.revokeObjectURL(viewerUrl);viewerUrl='';$('bigImage').removeAttribute('src')};
$('logout').onclick=async()=>{try{await api('/logout',{});location.replace('/login.html')}catch(e){notice(e.message,true)}};
async function verify(){try{
 const d=await api('/session');if(!d.user){$('gateMsg').textContent='请先登录后查看工作票';return;}
 if(d.user?.must_change_password){$('gateMsg').textContent='请先修改初始密码';return;}
 actor=d.user;csrf=d.csrf_token||'';if(!['admin','employee','sales','finance','partner'].includes(actor.role)){$('gateMsg').textContent='账号无系统访问权限';return;}
 $('username').textContent=actor.full_name||actor.username;
 $('back').href=actor?.role==='admin'?'/wholemanagement.html':actor?.role==='sales'?'/sales.html':actor?.role==='finance'?'/finance.html':actor?.role==='employee'?'/engineer.html':actor?.role==='partner'?'/sgcc_materials.html':'/';
 $('back').textContent='返回工作台 →';
 $('logout').hidden=false;
 $('new').hidden=false;
 await load();$('gate').hidden=true;$('app').hidden=false;
 }catch(e){$('gateMsg').textContent='验证或加载失败：'+e.message}}
$('workAt').addEventListener('input',()=>{$('titlePreview').value=buildTitle()});$('locationField').addEventListener('input',()=>{$('titlePreview').value=buildTitle()});
$('retry').onclick=verify;window.addEventListener('pageshow',verify);
</script></body></html>
