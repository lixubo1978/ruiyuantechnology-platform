<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>瑞渊办公｜国网商城物资词条</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f7f4;color:#244536;font:14px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif}header{background:#174b39;color:white;padding:17px 5%}header a{color:white}header .bar{max-width:1220px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center}main{max-width:1220px;margin:28px auto;padding:0 16px}.panel{background:white;border:1px solid #dce8df;border-radius:12px;padding:22px;margin:18px 0}h1{font-size:26px;margin:0}h2{font-size:19px;margin:0 0 12px}.muted{color:#74877a}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}button{padding:9px 14px;background:white;border:1px solid #cbdcd0;border-radius:7px;color:#174b39;cursor:pointer}button.primary{background:#174b39;color:white}button:disabled{opacity:.5}input,textarea,select{width:100%;border:1px solid #cbdcd0;border-radius:7px;padding:10px;font:inherit}label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.search{max-width:400px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{text-align:left;border-bottom:1px solid #e5eee7;padding:9px;font-size:12px}th{background:#edf5ee}td img{width:65px;height:55px;object-fit:contain;background:#f6f6f6;border-radius:5px}.photo{width:220px;max-width:100%;height:160px;object-fit:contain;border:1px solid #dce8df;border-radius:8px;background:#fafafa}.error{color:#b4232c}.success{color:#18714a}[hidden]{display:none!important}#gate{min-height:70vh;display:grid;place-items:center}#gate .panel{text-align:center}#app[hidden]{display:none!important}.foot{color:#85998b;font-size:12px;margin:25px 0}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}header .bar{flex-wrap:wrap}}
</style></head><body>
<section id="gate"><div class="panel"><h2>瑞渊办公系统</h2><p id="gateMsg">正在验证身份……</p><a href="/login.html">返回登录</a> <button id="retry">重新验证</button></div></section>
<div id="app" hidden><header><div class="bar"><strong>瑞渊办公 · 国网商城物资词条</strong><div class="row"><span id="username"></span><a href="/wholemanagement.html">返回管理工作台 →</a><button id="logout">退出登录</button></div></div></header>
<main><div class="row between"><div><h1>国网商城物资词条</h1><p class="muted">10项物资属性 + 1张商品说明图片 · 统一保存、检索和管理</p></div><div class="row"><button id="refresh">刷新</button><button id="new" class="primary">＋ 新增物资词条</button></div></div><p id="notice" role="status"></p>
<section id="listPanel" class="panel"><div class="row between"><h2>物资词条清单</h2><input class="search" id="search" placeholder="搜索名称、编码、型号、供应商"></div><div class="scroll"><table><thead><tr><th>图片</th><th>类别</th><th>国网物资编码</th><th>商品编码</th><th>条目编码</th><th>商品名称</th><th>规格型号</th><th>制造商</th><th>供应商</th><th>单位</th><th>参考单价</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="editPanel" class="panel" hidden><div class="row between"><h2 id="formTitle">新增物资词条</h2><button id="close">返回清单</button></div><form id="materialForm"><div class="grid">
<div><label>1. 物资类别</label><input name="category" placeholder="例如：特殊防误"></div>
<div><label>2. 国网物资编码</label><input name="material_code" placeholder="例如：1052004316"></div>
<div><label>3. 商品编码</label><input name="product_code" placeholder="例如：500163104"></div>
<div><label>4. 物资条目编码</label><input name="entry_code" placeholder="例如：500163104-000014-000011-0001"></div>
<div><label>5. 商品名称 *</label><input name="name" required placeholder="例如：临时接地端状态智能监测装置"></div>
<div><label>6. 规格型号</label><input name="model" placeholder="例如：HW-590F8"></div>
<div><label>7. 制造商</label><input name="manufacturer" placeholder="例如：珠海华伟电气科技股份有限公司"></div>
<div><label>8. 供应商</label><input name="supplier" placeholder="供应商名称"></div>
<div><label>9. 计量单位</label><input name="unit" value="个"></div>
<div><label>10. 参考单价（元）</label><input name="price" type="number" min="0" step="0.01" value="0"></div>
</div><div style="margin-top:14px"><label>补充说明（不计入10项属性）</label><textarea name="notes" rows="2" placeholder="来源、技术说明等"></textarea></div>
<div style="margin-top:16px"><label>商品说明图片（1张，自动压缩 WebP，最大1MB）</label><div class="row"><input type="file" id="photoFile" accept="image/*" style="max-width:400px"><img id="photoPreview" class="photo" alt="商品说明图片" hidden></div><p class="muted">先保存词条，系统再上传图片。编辑已有词条时可以替换图片。</p></div>
<div class="row" style="margin-top:20px"><button class="primary" id="save" type="submit">保存物资词条</button><button type="button" id="cancel">取消</button></div></form></section>
<div class="foot">瑞渊办公系统 · 仅通过 Cloudflare Worker API 访问数据库和图片</div></main></div>
<script>
'use strict';
const API='https://api.ruiyuantechnology.com/api/ruiyuan', $=id=>document.getElementById(id);
let csrf='',actor=null,items=[],editing=null,verifying=false,previewUrl='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(s,bad=false){$('notice').textContent=s||'';$('notice').className=bad?'error':'success';}
async function api(path,data){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),18000);try{const opt={credentials:'include',cache:'no-store',headers:{Accept:'application/json'},signal:ctrl.signal};if(data!==undefined){opt.method='POST';opt.headers['Content-Type']='application/json';opt.headers['X-Ruiyuan-CSRF']=csrf;opt.body=JSON.stringify(data)}const r=await fetch(API+path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'接口错误 HTTP '+r.status);return d}finally{clearTimeout(timer)}}
function showEditor(item=null){editing=item?.id||null;$('formTitle').textContent=item?'编辑物资词条':'新增物资词条';$('materialForm').reset();for(const key of ['category','material_code','product_code','entry_code','name','model','manufacturer','supplier','unit','price','notes'])$('materialForm').elements.namedItem(key).value=item?.[key]??(key==='unit'?'个':key==='price'?'0':'');$('photoFile').value='';$('photoPreview').hidden=true;$('photoPreview').removeAttribute('src');$('listPanel').hidden=true;$('editPanel').hidden=false;if(item?.image_path)loadPhoto(item.id,$('photoPreview'));window.scrollTo(0,0)}
function showList(){$('editPanel').hidden=true;$('listPanel').hidden=false;editing=null;window.scrollTo(0,0)}
async function loadPhoto(id,img){try{const r=await fetch(API+'/sgcc-materials/image?id='+encodeURIComponent(id),{credentials:'include',cache:'no-store'});if(!r.ok)return;const blob=await r.blob();const u=URL.createObjectURL(blob);img.onload=()=>URL.revokeObjectURL(u);img.src=u;img.hidden=false}catch{}}
function render(){const q=$('search').value.trim().toLowerCase();const data=items.filter(x=>[x.category,x.material_code,x.product_code,x.entry_code,x.name,x.model,x.manufacturer,x.supplier].some(v=>String(v||'').toLowerCase().includes(q)));$('rows').innerHTML=data.map(x=>`<tr><td><img data-photo="${esc(x.id)}" alt="商品图片" hidden></td><td>${esc(x.category)}</td><td>${esc(x.material_code)}</td><td>${esc(x.product_code)}</td><td>${esc(x.entry_code)}</td><td>${esc(x.name)}</td><td>${esc(x.model)}</td><td>${esc(x.manufacturer)}</td><td>${esc(x.supplier)}</td><td>${esc(x.unit)}</td><td>¥${Number(x.price||0).toFixed(2)}</td><td><button data-edit="${esc(x.id)}">编辑</button> <button data-archive="${esc(x.id)}">归档</button></td></tr>`).join('')||'<tr><td colspan="12">暂无物资词条</td></tr>';document.querySelectorAll('img[data-photo]').forEach(img=>{const x=data.find(z=>z.id===img.dataset.photo);if(x?.image_path)loadPhoto(x.id,img)})}
async function load(){const d=await api('/sgcc-materials');items=d.items||[];render()}
async function compress(file){if(file.size>20*1024*1024)throw Error('原始图片不能超过20MB');const bitmap=await createImageBitmap(file);let w=bitmap.width,h=bitmap.height,scale=Math.min(1,1200/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(bitmap,0,0,w,h);bitmap.close();let quality=.8;for(let n=0;n<5;n++){const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',quality));if(!blob)throw Error('浏览器不支持 WebP 图片');if(blob.size<=1048576)return blob;quality-=.13}throw Error('图片压缩后仍超过1MB，请换较小图片')}
async function upload(id,file){const blob=await compress(file);const r=await fetch(API+'/sgcc-materials/image?id='+encodeURIComponent(id),{method:'POST',credentials:'include',headers:{'Content-Type':'image/webp','X-Ruiyuan-CSRF':csrf},body:blob});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'图片上传失败')}
async function verify(){if(verifying)return;verifying=true;try{const d=await api('/session');if(!d.user){$('gateMsg').textContent='请先登录';return}if(d.user.must_change_password){$('gateMsg').textContent='请先修改初始密码';return}if(!['admin','finance'].includes(d.user.role)){$('gateMsg').textContent='没有物资词条查看权限';return}actor=d.user;csrf=d.csrf_token||'';$('username').textContent=actor.full_name||actor.username;if(actor.role!=='admin')$('new').hidden=true;await load();$('gate').hidden=true;$('app').hidden=false}catch(e){$('gateMsg').textContent='加载失败：'+e.message}finally{verifying=false}}
$('retry').onclick=verify;$('refresh').onclick=()=>load().catch(e=>notice(e.message,true));$('search').oninput=render;$('new').onclick=()=>showEditor();$('close').onclick=showList;$('cancel').onclick=showList;
$('rows').onclick=async e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-archive]');const id=edit?.dataset.edit||del?.dataset.archive;if(!id)return;const x=items.find(z=>z.id===id);if(actor?.role!=='admin'){notice('仅管理员可修改词条',true);return}if(edit)showEditor(x);else if(confirm('确认归档该物资词条？历史数据不会删除。')){try{await api('/sgcc-materials/archive',{id});await load();notice('归档成功')}catch(ex){notice(ex.message,true)}}};
$('photoFile').onchange=()=>{const file=$('photoFile').files[0];if(!file)return;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(file);$('photoPreview').src=previewUrl;$('photoPreview').hidden=false};
$('materialForm').onsubmit=async e=>{e.preventDefault();const btn=$('save');btn.disabled=true;notice('');try{const data=Object.fromEntries(new FormData(e.target).entries());data.id=editing;const saved=await api('/sgcc-materials/save',data);const file=$('photoFile').files[0];if(file){try{await upload(saved.id,file)}catch(error){await load();notice('词条已保存，但图片上传失败：'+error.message,true);btn.disabled=false;return}}await load();showList();notice('物资词条保存成功')}catch(ex){notice(ex.message,true)}finally{btn.disabled=false}};
$('logout').onclick=async()=>{try{await api('/logout',{});location.replace('/login.html')}catch(e){notice(e.message,true)}};
window.addEventListener('pageshow',verify);
</script></body></html>
