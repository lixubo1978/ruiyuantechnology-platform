<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>瑞渊办公｜采购管理</title><meta name="robots" content="noindex,nofollow"><style>
*{box-sizing:border-box}body{margin:0;background:#f2f7f4;color:#244536;font:14px/1.6 system-ui,-apple-system,'Microsoft YaHei',sans-serif}header{background:#174b39;color:white;padding:18px 5%}header a{color:white}main{max-width:1250px;margin:28px auto;padding:0 16px}.top,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top{justify-content:space-between}.panel{background:white;border:1px solid #dce8df;border-radius:12px;padding:20px;margin:18px 0}h1{margin:0;font-size:27px}h2{font-size:19px;margin:8px 0}.muted{color:#708578}button{padding:9px 13px;border:1px solid #bed6c7;background:white;color:#174b39;border-radius:7px;cursor:pointer}.primary,.active{background:#174b39;color:white}input,select,textarea{padding:9px;border:1px solid #c8d8cd;border-radius:7px;width:100%;font:inherit}label{font-weight:650;font-size:12px;display:block;margin:5px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid.two{grid-template-columns:repeat(2,1fr)}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:9px;border-bottom:1px solid #e0eae2}th{background:#eff6f0}section[hidden],#app[hidden]{display:none!important}.tabs{margin:18px 0;display:flex;gap:8px}.item{display:grid;grid-template-columns:2fr 1fr .7fr .7fr 1fr .7fr auto;gap:6px;margin:8px 0}.item input{min-width:0}.red{color:#b52e2e;font-weight:bold}#error{color:#b52e2e}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#eef6ef;padding:12px;border-radius:9px}.stat b{font-size:19px;display:block}#gate{min-height:65vh;display:grid;place-items:center}#gate .panel{max-width:430px;text-align:center}@media(max-width:800px){.grid,.grid.two,.stats{grid-template-columns:1fr 1fr}.item{grid-template-columns:repeat(3,1fr)}}@media(max-width:500px){.grid,.grid.two,.stats{grid-template-columns:1fr}}@media print{header,.tabs,.noprint,#listPage,#editPage{display:none!important}body{background:white}main{margin:0}#detailPage{display:block!important}.panel{border:0}table{min-width:0}}
</style></head><body>
<div id="gate"><div class="panel"><h2>瑞渊采购合同管理</h2><p id="gateMsg">正在验证登录身份……</p><a href="/login.html">返回登录</a> <button id="retry">重新验证</button></div></div>
<div id="app" hidden><header><div class="top"><strong>瑞渊办公 · 采购管理</strong><div class="row"><span id="username"></span><a href="/wholemanagement.html">返回总工作台</a><button id="logout">退出登录</button></div></div></header><main><h1>采购合同管理</h1><p class="muted">采购合同、手工明细、最终采购价、分次发票、付款及履约保证金</p><p id="error" role="alert"></p><div class="tabs noprint"><button data-tab="listPage" class="active">采购合同台账</button><button data-tab="editPage">新建采购合同</button><button data-tab="detailPage" id="detailTab" hidden>合同详情</button></div>
<section id="listPage" class="panel"><div class="row"><h2>采购合同台账</h2><button id="refresh">刷新</button></div><div class="grid two"><div><label>搜索编号、合同、供应商</label><input id="search"></div><div><label>年度</label><select id="year"><option value="">全部年度</option></select></div></div><div class="scroll"><table><thead><tr><th>合同编号</th><th>合同名称</th><th>供应商</th><th>签署日期</th><th>最终采购价</th><th>已开票</th><th>已付款</th><th>未付款</th><th>操作</th></tr></thead><tbody id="listRows"></tbody></table></div></section>
<section id="editPage" class="panel" hidden><h2>新建采购合同</h2><form id="createForm"><div class="grid"><div><label>合同名称 *</label><input name="title" required></div><div><label>采购方（本公司）*</label><select id="buyer" name="buyer_company_id" required></select></div><div><label>供应商 *</label><select id="supplier" name="supplier_company_id" required></select></div><div><label>签署人 *</label><select id="signer" name="signer_id" required></select></div><div><label>签订日期</label><input name="signed_on" type="date"></div><div><label>合同状态</label><select name="contract_status"><option value="draft">草稿</option><option value="active">执行中</option><option value="completed">已完成</option></select></div><div><label>履约保证金（元，允许0）</label><input name="deposit_amount" type="number" min="0" step="0.01" value="0"></div><div><label>外部合同编号（留空自动生成）</label><input name="number"></div><div><label>备注</label><input name="note"></div></div><h2>采购明细（逐项手工填写）</h2><div class="item"><b>内容</b><b>规格</b><b>单位</b><b>数量</b><b>单价</b><b>税率%</b><b>操作</b></div><div id="items"></div><button type="button" id="addItem">＋增加明细</button><div class="grid two"><div><label>明细参考合计</label><input id="lineTotal" readonly></div><div><label>最终采购优惠价 *</label><input id="finalPrice" name="final_price" type="number" min="0" step="0.01" required></div></div><label>正式合同条款（可逐份修改）</label><textarea id="clauses" name="clauses" rows="7"></textarea><div class="row" style="justify-content:flex-end;margin-top:15px"><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存采购合同</button></div></form></section>
<section id="detailPage" class="panel" hidden><div class="row noprint"><h2>合同详情</h2><button id="back">返回列表</button><button id="printContract">打印正式合同</button><button id="printItems">打印明细单</button></div><div id="printArea"></div><div class="noprint"><h2>分次开票、付款及保证金</h2><form id="eventForm"><div class="grid"><div><label>类型</label><select name="event_type"><option value="invoice">收到发票</option><option value="payment">采购付款</option><option value="deposit_paid">保证金缴纳</option><option value="deposit_returned">保证金退还</option><option value="deposit_deducted">保证金扣除</option><option value="fulfillment">履约记录</option></select></div><div><label>日期</label><input type="date" name="event_date" required></div><div><label>金额（元）</label><input type="number" name="amount" min="0" step="0.01" required></div><div><label>发票税率%</label><input type="number" name="tax_rate" min="0" max="100" step="0.01" value="0"></div><div><label>发票号/流水号</label><input name="reference_no"></div><div><label>备注</label><input name="notes"></div></div><button class="primary">保存记录</button></form><h2>历史记录</h2><div class="scroll"><table><thead><tr><th>日期</th><th>类型</th><th>金额</th><th>税率</th><th>号码</th><th>备注</th></tr></thead><tbody id="eventRows"></tbody></table></div><p class="muted">合同付款记录不自动写入公司直接付款流水，防止重复计账。发票图片和合同附件上传留待后续版本。</p></div></section>
</main></div>
<script>
'use strict';const API='https://api.ruiyuantechnology.com/api/ruiyuan';const $=id=>document.getElementById(id);let csrf='',actor=null,opts={companies:[],signers:[]},contracts=[],current=null,printMode='contract';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>'¥'+Number(v||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});function err(v){$('error').textContent=v||'';}
async function api(path,data){const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);try{const init={credentials:'include',cache:'no-store',headers:{Accept:'application/json'},signal:c.signal};if(data!==undefined){init.method='POST';init.headers['Content-Type']='application/json';init.headers['X-Ruiyuan-CSRF']=csrf;init.body=JSON.stringify(data);}const r=await fetch(API+path,init),j=await r.json();if(!r.ok)throw Error(j.error||'接口错误');return j;}finally{clearTimeout(t)}}
function tab(id){['listPage','editPage','detailPage'].forEach(x=>$(x).hidden=x!==id);document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));if(id==='editPage')reset();err('')}
const DEFAULT='一、采购内容：以合同明细为准。\n二、合同价款：以最终采购价为准。\n三、交付验收：按约定交付并验收。\n四、付款：按双方约定的节点执行。\n五、质量及质保：供应商应符合约定标准。\n六、履约保证金：如有约定按合同执行。\n七、争议解决：协商不成依法处理。';
function options(){const make=(xs,t)=>'<option value="">'+t+'</option>'+xs.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');$('buyer').innerHTML=make(opts.companies.filter(x=>x.kind==='ours'),'选择本公司');$('supplier').innerHTML=make(opts.companies,'选择供应商');$('signer').innerHTML=make(opts.signers,'选择签署人')}
function addItem(){const d=document.createElement('div');d.className='item';d.innerHTML='<input class="desc" placeholder="采购内容" required><input class="spec" placeholder="规格"><input class="unit" value="项"><input class="qty" type="number" min="0.001" step="0.001" value="1" required><input class="price" type="number" min="0" step="0.01" value="0" required><input class="tax" type="number" min="0" max="100" step="0.01" value="0"><button type="button">删除</button>';d.querySelector('button').onclick=()=>{d.remove();calc()};d.querySelectorAll('input').forEach(x=>x.oninput=calc);$('items').append(d);calc()}
function itemData(){return [...$('items').children].map(x=>({description:x.querySelector('.desc').value.trim(),specification:x.querySelector('.spec').value,unit:x.querySelector('.unit').value,quantity:x.querySelector('.qty').value,unit_price:x.querySelector('.price').value,tax_rate:x.querySelector('.tax').value}))}function calc(){let v=itemData().reduce((s,x)=>s+Math.round(Number(x.quantity)*Number(x.unit_price)*100)/100,0);$('lineTotal').value=v.toFixed(2);return v}function reset(){$('createForm').reset();$('items').innerHTML='';$('clauses').value=DEFAULT;addItem();$('finalPrice').value=''}
async function load(){const d=await api('/procurement-contracts');contracts=d.contracts||[];render()}
function render(){const q=$('search').value.toLowerCase(),y=$('year').value;const years=[...new Set(contracts.map(x=>(x.signed_on||'').slice(0,4)).filter(Boolean))].sort().reverse();$('year').innerHTML='<option value="">全部年度</option>'+years.map(x=>`<option ${x===y?'selected':''}>${x}</option>`).join('');$('listRows').innerHTML=contracts.filter(x=>(!y||(x.signed_on||'').startsWith(y))&&[x.number,x.title,x.supplier].some(z=>String(z||'').toLowerCase().includes(q))).map(x=>`<tr><td>${esc(x.number)}</td><td>${esc(x.title)}</td><td>${esc(x.supplier)}</td><td>${esc(x.signed_on)}</td><td>${money(x.amount)}</td><td>${money(x.invoiced)}</td><td>${money(x.paid)}</td><td class="red">${money(Math.max(0,Number(x.amount)-Number(x.paid)))}</td><td><button data-id="${esc(x.id)}">查看/打印</button></td></tr>`).join('')||'<tr><td colspan="9">暂无记录</td></tr>'}
function companyName(id){return opts.companies.find(x=>x.id===id)?.name||'—'}
function eventName(t){return {invoice:'收到发票',payment:'采购付款',deposit_paid:'保证金缴纳',deposit_returned:'保证金退还',deposit_deducted:'保证金扣除',fulfillment:'履约记录'}[t]||t}
function renderDetail(){if(!current)return;const c=current.contract,lines=current.items||[],ev=current.events||[];const sum=lines.reduce((s,x)=>s+Number(x.ruiyuan_quantity)*Number(x.ruiyuan_unit_price),0);const paid=ev.filter(x=>x.ruiyuan_event_type==='payment').reduce((s,x)=>s+Number(x.ruiyuan_amount),0),invoiced=ev.filter(x=>x.ruiyuan_event_type==='invoice').reduce((s,x)=>s+Number(x.ruiyuan_amount),0);const rows=lines.map(x=>`<tr><td>${esc(x.ruiyuan_description)}</td><td>${esc(x.ruiyuan_specification)}</td><td>${esc(x.ruiyuan_unit)}</td><td>${esc(x.ruiyuan_quantity)}</td><td>${money(x.ruiyuan_unit_price)}</td><td>${esc(x.ruiyuan_tax_rate)}%</td><td>${money(Number(x.ruiyuan_quantity)*Number(x.ruiyuan_unit_price))}</td></tr>`).join('');let h=`<h2 style="text-align:center">${printMode==='contract'?'采购合同':'采购合同明细单'}</h2><p>合同编号：${esc(c.ruiyuan_contract_no)}　签署日期：${esc(c.ruiyuan_signed_on||'—')}</p><p>采购方：${esc(companyName(c.ruiyuan_buyer_company_id))}　供应商：${esc(c.ruiyuan_supplier)}</p><p>合同名称：${esc(c.ruiyuan_title)}　签署人员：${esc(c.ruiyuan_signer_name)}</p><div class="scroll"><table><thead><tr><th>内容</th><th>规格</th><th>单位</th><th>数量</th><th>单价</th><th>税率</th><th>金额</th></tr></thead><tbody>${rows||'<tr><td colspan="7">旧采购合同无明细</td></tr>'}</tbody></table></div><p>明细参考合计：${money(sum)}　<strong>最终采购价：${money(c.ruiyuan_amount)}</strong></p><div class="stats"><div class="stat">累计开票<b>${money(invoiced)}</b></div><div class="stat">累计付款<b>${money(paid)}</b></div><div class="stat">未付款<b class="red">${money(Math.max(0,Number(c.ruiyuan_amount)-paid))}</b></div><div class="stat">履约保证金<b>${money(c.ruiyuan_deposit_amount)}</b></div></div>`;if(printMode==='contract')h+=`<h3>合同条款</h3><p style="white-space:pre-wrap">${esc(c.ruiyuan_clauses||'以双方正式签署文本为准。')}</p><div style="display:flex;justify-content:space-between;margin-top:60px"><span>采购方签章：________________</span><span>供应商签章：________________</span></div>`;$('printArea').innerHTML=h;$('eventRows').innerHTML=ev.map(x=>`<tr><td>${esc(x.ruiyuan_event_date)}</td><td>${esc(eventName(x.ruiyuan_event_type))}</td><td>${money(x.ruiyuan_amount)}</td><td>${esc(x.ruiyuan_tax_rate)}%</td><td>${esc(x.ruiyuan_reference_no)}</td><td>${esc(x.ruiyuan_notes)}</td></tr>`).join('')||'<tr><td colspan="6">暂无记录</td></tr>'}
async function detail(id){current=await api('/procurement-contracts/detail',{id});printMode='contract';$('detailTab').hidden=false;tab('detailPage');renderDetail()}
async function verify(){try{const d=await api('/session');if(!d.user){$('gateMsg').textContent='请先登录';return}if(d.user.must_change_password){$('gateMsg').textContent='请先修改初始密码';return}if(!['admin','finance'].includes(d.user.role)){$('gateMsg').textContent='仅管理员和财务人员可进入采购合同管理';return}actor=d.user;csrf=d.csrf_token||'';$('username').textContent=actor.full_name||actor.username;opts=await api('/procurement-contracts/options');options();await load();$('gate').hidden=true;$('app').hidden=false;}catch(e){$('gateMsg').textContent='加载失败：'+e.message}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('retry').onclick=verify;$('refresh').onclick=()=>load().catch(e=>err(e.message));$('search').oninput=render;$('year').onchange=render;$('addItem').onclick=addItem;$('cancel').onclick=()=>tab('listPage');$('back').onclick=()=>tab('listPage');$('listRows').onclick=e=>{const b=e.target.closest('[data-id]');if(b)detail(b.dataset.id).catch(x=>err(x.message))};
$('createForm').onsubmit=async e=>{e.preventDefault();err('');try{const f=Object.fromEntries(new FormData(e.target).entries());f.items=itemData();if(!f.items.length)throw Error('至少一条明细');if(f.items.some(x=>!x.description||!(Number(x.quantity)>0)))throw Error('请填写有效采购明细');if(Number(f.final_price)>calc())throw Error('最终采购价不能超过明细合计');await api('/procurement-contracts/create',f);await load();tab('listPage');}catch(x){err(x.message)}};
$('eventForm').onsubmit=async e=>{e.preventDefault();try{if(!current)throw Error('请先选择合同');const d=Object.fromEntries(new FormData(e.target).entries());d.id=current.contract.ruiyuan_id;await api('/procurement-contracts/event',d);e.target.reset();await detail(d.id)}catch(x){err(x.message)}};
$('printContract').onclick=()=>{printMode='contract';renderDetail();window.print()};$('printItems').onclick=()=>{printMode='items';renderDetail();window.print()};$('logout').onclick=async()=>{try{await api('/logout',{});location.replace('/login.html')}catch(e){err(e.message)}};
window.addEventListener('pageshow',()=>{if(!$('app').hidden)return;verify()});
</script></body></html>
