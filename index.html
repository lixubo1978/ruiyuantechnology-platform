<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>瑞渊办公系统</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f6f3;color:#234634;font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif}main{max-width:950px;margin:auto;padding:24px}.card{background:white;padding:25px;border:1px solid #dbe6df;border-radius:12px;margin:20px auto}.auth{max-width:420px;margin:8vh auto}input,select,button{font:inherit;padding:10px;border:1px solid #cbd9ce;border-radius:7px}input{width:100%;margin:6px 0 13px}button{cursor:pointer;background:#19583e;color:white}button.secondary{background:white;color:#19583e}button:disabled{opacity:.5}.hidden{display:none}header{background:#194a35;color:white;padding:20px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex-shrink:0}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e1eae3;text-align:left}section{margin-bottom:20px}.error{color:#a52f2f;min-height:20px}.muted{color:#718579;font-size:13px}h1{font-size:24px}h2{font-size:19px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.scroll{overflow:auto}@media(max-width:600px){.fields{grid-template-columns:1fr}}</style></head>
<body><header><strong>瑞渊公司办公系统</strong></header><main>
<section id="login" class="card auth"><h1>登录办公系统</h1><form id="loginForm"><label>用户名<input id="username" required autocomplete="username" placeholder="例如：李序博"></label><label>密码<input id="password" required type="password" autocomplete="current-password"></label><button>登录</button></form><p class="error" id="loginError"></p></section>
<section id="change" class="card auth hidden"><h1>修改密码</h1><p class="muted">首次登录必须修改密码；修改后重新登录。</p><form id="changeForm"><label>当前密码<input id="oldPassword" required type="password"></label><label>新密码（8至72字符）<input id="newPassword" required minlength="8" maxlength="72" type="password"></label><label>确认新密码<input id="confirmPassword" required type="password"></label><button>保存新密码</button></form><p class="error" id="changeError"></p><button class="secondary" id="changeLogout">退出</button></section>
<section id="office" class="hidden"><div class="card"><div class="row"><h1>办公工作台</h1><span id="welcome"></span><button id="logout">退出登录</button><button class="secondary" id="changeOpen">修改密码</button></div><p class="muted">V1.0：登录、账号与权限管理已接入数据库；财务模块后续逐项开发，不展示虚构财务数据。</p></div>
<div id="adminPanel" class="hidden"><div class="card"><h2>创建员工账号</h2><p class="muted">初始密码统一为 12345678，首次登录必须修改。</p><form id="createForm" class="fields"><label>用户名<input name="username" required></label><label>姓名<input name="full_name" required></label><label>员工编号<input name="employee_no"></label><label>部门<input name="department"></label><label>职位<input name="job_title"></label><label>电话<input name="phone"></label><label>邮箱<input name="email"></label><label>角色<select name="role"><option value="employee">员工</option><option value="finance">财务</option><option value="admin">管理员</option></select></label><button>创建账号</button></form></div>
<div class="card"><div class="row"><h2>人员账号</h2><button class="secondary" id="refresh">刷新</button></div><div class="scroll"><table><thead><tr><th>姓名</th><th>用户名</th><th>角色</th><th>状态</th><th>首次改密</th><th>操作</th></tr></thead><tbody id="userRows"></tbody></table></div></div></div><p class="error" id="officeError"></p></section>
</main><script>
const API='https://api.ruiyuantechnology.com/api/ruiyuan';let user=null,csrf='';const $=id=>document.getElementById(id);
function view(id){for(const k of ['login','change','office'])$(k).classList.toggle('hidden',k!==id)}
function error(id,msg){$(id).textContent=msg||''}
async function call(path,method='GET',payload){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),15000);try{const headers={Accept:'application/json'};if(method==='POST'){headers['Content-Type']='application/json';if(path!=='login')headers['X-Ruiyuan-CSRF']=csrf}const r=await fetch(API+'/'+path,{method,credentials:'include',cache:'no-store',headers,body:payload===undefined?undefined:JSON.stringify(payload),signal:ctrl.signal});const data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');return data}finally{clearTimeout(timer)}}
function showUser(){if(!user){view('login');return}if(user.must_change_password){view('change');return}view('office');$('welcome').textContent=user.full_name+'（'+user.role+'）';$('adminPanel').classList.toggle('hidden',user.role!=='admin');if(user.role==='admin')loadUsers()}
async function refreshSession(){try{const d=await call('session');user=d.user;csrf=d.csrf_token||'';showUser()}catch(e){view('login');error('loginError','登录服务暂不可用：'+e.message)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();error('loginError','');try{const d=await call('login','POST',{username:$('username').value.trim(),password:$('password').value});user=d.user;csrf=d.csrf_token;$('password').value='';showUser()}catch(err){error('loginError',err.message)}};
$('changeForm').onsubmit=async e=>{e.preventDefault();if($('newPassword').value!==$('confirmPassword').value){error('changeError','两次新密码不一致');return}try{await call('password','POST',{old_password:$('oldPassword').value,new_password:$('newPassword').value});user=null;csrf='';view('login');error('loginError','修改成功，请使用新密码重新登录')}catch(err){error('changeError',err.message)}};
async function logout(){try{if(csrf)await call('logout','POST',{})}catch{}user=null;csrf='';view('login')}
$('logout').onclick=logout;$('changeLogout').onclick=logout;$('changeOpen').onclick=()=>{error('changeError','');view('change')};
async function loadUsers(){try{const d=await call('users');$('userRows').replaceChildren();for(const u of d.users||[]){const tr=document.createElement('tr');for(const value of [u.full_name,u.username,u.role,u.status,u.must_change_password?'是':'否']){const td=document.createElement('td');td.textContent=value;tr.appendChild(td)}const td=document.createElement('td');for(const [label,path,payload] of [['重置密码','reset-password',{id:u.id}],[(u.status==='active'?'停用':'启用'),'update-user',{id:u.id,status:u.status==='active'?'disabled':'active'}]]){const b=document.createElement('button');b.textContent=label;b.className='secondary';b.disabled=u.id===user.id;b.onclick=async()=>{if(!confirm('确定对 '+u.full_name+' 执行「'+label+'」吗？'))return;try{await call(path,'POST',payload);error('officeError','操作成功');await loadUsers()}catch(e){error('officeError',e.message)}};td.appendChild(b)}tr.appendChild(td);$('userRows').appendChild(tr)}}catch(e){error('officeError',e.message)}}
$('refresh').onclick=loadUsers;
$('createForm').onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(e.target).entries());await call('create-user','POST',d);e.target.reset();error('officeError','创建成功，初始密码为12345678');await loadUsers()}catch(err){error('officeError',err.message)}};
refreshSession();
</script></body></html>
